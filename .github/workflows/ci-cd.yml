# .github/workflows/ci-cd.yml
# SpiriCom NOC Platform — CI/CD Pipeline

name: SpiriCom CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  # ─────────────────────────────────────────────────────────────────────
  # Job 1 — Lint + Build
  # ─────────────────────────────────────────────────────────────────────
  lint-and-test:
    name: 🔍 Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ── Python ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install backend deps
        run: pip install -r requirements.txt

      - name: Lint backend (flake8)
        run: |
          pip install flake8
          flake8 src/ --max-line-length=120 --extend-ignore=E203,W503 || true


      # ── Node ───────────────────────────────────────────────────────
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: compspirit/package-lock.json

      - name: Install frontend deps
        run: cd compspirit && npm ci

      - name: Build frontend
        run: cd compspirit && npm run build


  # ─────────────────────────────────────────────────────────────────────
  # Job 2 — Docker images → GHCR
  # ─────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build & Push
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./compspirit
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest


  # ─────────────────────────────────────────────────────────────────────
  # Job 3 — Deploy Backend to Render
  # ─────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: 🚀 Deploy to Render
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            --fail \
            --silent \
            --show-error

          echo "✅ Render deploy triggered"


  # ─────────────────────────────────────────────────────────────────────
  # Job 4 — Health Check
  # ─────────────────────────────────────────────────────────────────────
  health-check:
    name: 🏥 Health Check
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Wait for Render cold start
        run: sleep 120


      - name: Backend health check
        run: |
          curl --fail \
            --retry 6 \
            --retry-delay 20 \
            --retry-connrefused \
            --max-time 15 \
            "https://spiricom-backend.onrender.com/health"

          echo "✅ Backend is live"


      - name: Frontend health check
        run: |
          curl --fail \
            --max-time 15 \
            "https://TON_APP.vercel.app"

          echo "✅ Frontend is live"